name: Verify Unicorn

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Audit all dependencies with a high-severity release gate
        run: npm audit --json --audit-level=high --fetch-retries=1 --fetch-timeout=30000 > test-results/dependency-audit.json
      - name: Audit packaged production dependencies
        run: npm audit --omit=dev --json --audit-level=low --fetch-retries=1 --fetch-timeout=30000 > test-results/production-audit.json
      - run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: unit-test-reports
          path: test-results
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generate isolated HTTPS fixture certificate
        run: node tests/fixtures/prepare-cert.mjs
      - name: Trust the fixture certificate in this temporary runner
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = (Resolve-Path 'tmp/test-certificates/fixture.cer').Path
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
          if ($certificate.Subject -ne 'CN=Unicorn Local QA Fixture' -or $certificate.Issuer -ne $certificate.Subject) {
            throw 'The generated certificate is not the expected isolated fixture CA'
          }
          $thumbprint = $certificate.Thumbprint
          "UNICORN_FIXTURE_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          # Hosted Windows runners are administrators. The machine store avoids the
          # current-user root import confirmation dialog in an unattended session.
          # Only this freshly generated test certificate is added; TLS checks stay on.
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'test-results/certificate-import.stdout.txt'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'test-results/certificate-import.stderr.txt'
          $arguments = @('-f', '-addstore', 'Root', ('"{0}"' -f $certificatePath))
          $process = Start-Process -FilePath "$env:SystemRoot\System32\certutil.exe" -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (!$process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Fixture certificate import timed out after 30 seconds'
          }
          Get-Content $stdout
          Get-Content $stderr
          if ($process.ExitCode -ne 0) { throw "Certificate import failed: $($process.ExitCode)" }
          $installed = Get-Item "Cert:\LocalMachine\Root\$thumbprint" -ErrorAction Stop
          if ([Convert]::ToBase64String($installed.RawData) -ne [Convert]::ToBase64String($certificate.RawData)) {
            throw 'The installed fixture certificate does not match the generated certificate'
          }
          Write-Host "Verified isolated fixture CA in LocalMachine\Root: $thumbprint"
          $certificate.Dispose()
      - name: Exercise real Chromium and proxy failures
        run: npm run test:e2e
      - name: Build Windows installer and portable archive
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Extract and launch the portable Windows archive
        timeout-minutes: 4
        run: npm run test:packaged
      - name: Verify installer installation and launch
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Stop-SmokeProcessTree([System.Diagnostics.Process]$Target) {
            if ($Target.HasExited) { return }
            $cleanup = Start-Process -FilePath "$env:SystemRoot\System32\taskkill.exe" -ArgumentList @('/PID', "$($Target.Id)", '/T', '/F') -PassThru -NoNewWindow
            if (!$cleanup.WaitForExit(10000)) { $cleanup.Kill() }
          }
          $installer = Get-ChildItem release/Unicorn-Setup-*.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer executable is missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'UnicornInstalled'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$destination" -PassThru
          if (!$process.WaitForExit(120000)) {
            try { Stop-SmokeProcessTree $process } catch { Write-Warning "Installer cleanup also failed: $_" }
            throw 'Installer timed out after 120 seconds'
          }
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $destination 'Unicorn.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable is missing' }
          $report = Join-Path $env:GITHUB_WORKSPACE 'test-results/installed-smoke.json'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList ('"--smoke-output={0}"' -f $report) -PassThru
          if (!$process.WaitForExit(60000)) {
            try { Stop-SmokeProcessTree $process } catch { Write-Warning "Installed app cleanup also failed: $_" }
            throw 'Installed app timed out after 60 seconds'
          }
          if ($process.ExitCode -ne 0) { throw 'Installed app failed' }
          $result = Get-Content $report | ConvertFrom-Json
          $expectedVersion = (Get-Content package.json | ConvertFrom-Json).version
          if (!$result.windowReady -or !$result.sandbox -or !$result.contextIsolation -or $result.platform -ne 'win32' -or $result.version -ne $expectedVersion -or $result.browsers -lt 1 -or $result.browsers -gt 20) { throw 'Installed app version/security smoke check failed' }
      - run: npm run checksums
      - name: Record package signature and integrity evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem release/*.exe) + @(Get-ChildItem release/*.zip)
          $evidence = @($packages | ForEach-Object {
            $signature = if ($_.Extension -eq '.exe') { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status.ToString() } else { $null }
            [pscustomobject]@{
              filename = $_.Name
              bytes = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              authenticodeStatus = $signature
            }
          })
          $evidence | ConvertTo-Json -Depth 4 | Set-Content test-results/package-evidence.json
      - name: Remove the temporary trusted certificate
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: |
          if ($env:UNICORN_FIXTURE_THUMBPRINT -match '^[0-9A-Fa-f]{40}$') {
            $certificatePath = "Cert:\LocalMachine\Root\$env:UNICORN_FIXTURE_THUMBPRINT"
            if (Test-Path $certificatePath) {
              Remove-Item $certificatePath -Force -Confirm:$false -ErrorAction Stop
            }
          }
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: windows-verification-reports
          path: |
            test-results
            playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: success()
        with:
          name: windows-release-assets
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          retention-days: 30
